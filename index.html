  <style>
    :root {
      --bg: #000000;
      --card: #0c0c0e;
      --border: #24242c;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Be Vietnam Pro', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px 20px;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border-radius: 12px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .sublink {
      display: block;
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: underline;
    }
  </style>

  <script>
    // Doc link moi nhat tu target.json (them ?t= de tranh cache), loi thi dung link du phong
    const fallbackUrl = "https://judy-configured-apartment-occupation.trycloudflare.com";
    fetch("target.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => r.json()).then(d => d.url).catch(() => fallbackUrl)
      .then(u => setTimeout(() => window.location.replace(u || fallbackUrl), 300));
  </script>
</head>
<body>
  <div class="card">

    <a href="https://ulvis.net/thanhtung93" class="sublink">Link dự phòng (ulvis.net/thanhtung93)</a>
  </div>
</body>
